name: Build FreeFlow Bubble (Android)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FF_VERSION: 1.0.${{ github.run_number }}
      FF_CODE: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key (kept in the build cache, never in the repo)
        uses: actions/cache@v4
        with:
          path: android/app/ci-signing
          key: freeflow-android-signing-v1

      - name: Create signing key on first build
        run: |
          mkdir -p app/ci-signing
          if [ ! -f app/ci-signing/release.p12 ]; then
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore app/ci-signing/release.p12 -storetype PKCS12 \
              -storepass "$PW" -keypass "$PW" -alias freeflow -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=FreeFlow Bubble"
            echo "$PW" > app/ci-signing/pw
          fi
          PW=$(cat app/ci-signing/pw)
          printf 'storeFile=ci-signing/release.p12\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=freeflow\n' "$PW" "$PW" > app/signing.properties

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk FreeFlow-Bubble-v$FF_VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreeFlow-Bubble
          path: android/FreeFlow-Bubble-v*.apk

      - name: Publish release
        run: |
          gh release create "android-v$FF_VERSION" "FreeFlow-Bubble-v$FF_VERSION.apk" \
            --title "FreeFlow Bubble for Android $FF_VERSION" \
            --latest=false \
            --notes "Install the APK (allow installing from your browser/Files app when asked), open FreeFlow Bubble and follow the setup checklist."
