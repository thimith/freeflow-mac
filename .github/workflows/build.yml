name: Build FreeFlow.dmg

on:
  push:
    branches: [main]
    paths-ignore: ['windows/**', 'android/**', '.github/workflows/windows.yml', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode (macOS 26 SDK enables Apple Intelligence)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          swift --version

      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: vendor/bin
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/build-whisper.sh') }}

      - name: Build whisper.cpp
        run: '[ -x vendor/bin/whisper-server ] || ./scripts/build-whisper.sh'

      - name: Build app and DMG
        run: |
          ./make-dmg.sh
          cp build/FreeFlow.dmg "build/FreeFlow-v1.0.${{ github.run_number }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: FreeFlow-dmg
          path: build/FreeFlow-v*.dmg
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" "build/FreeFlow-$TAG.dmg" \
            --title "FreeFlow for Mac $TAG" \
            --latest \
            --notes "Drag FreeFlow to Applications, open it, and if macOS warns about the developer use System Settings → Privacy & Security → Open Anyway. Apple Silicon (M1 or newer), macOS 14+."
